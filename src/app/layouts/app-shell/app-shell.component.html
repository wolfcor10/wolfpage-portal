<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <strong>WolfPage</strong>
      <span>Portal</span>
    </div>

    <nav class="nav" aria-label="Principal">
      <a routerLink="/app/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/app/templates" routerLinkActive="active">Templates</a>
      <a routerLink="/app/pages/new" routerLinkActive="active">Crear pagina</a>
      <a routerLink="/app/pages" routerLinkActive="active">Paginas</a>
      @if (auth.hasRole('admin')) {
        <a routerLink="/app/settings/users" routerLinkActive="active">Usuarios</a>
      }
    </nav>
  </aside>

  <main class="workspace">
    <header class="topbar">
      @if (auth.currentUser$ | async; as user) {
        <div>
          <strong>{{ user.fullName }}</strong>
          <span>{{ user.email }}</span>
        </div>
      }
      <button type="button" class="button secondary" (click)="logout()">Salir</button>
    </header>

    <section class="content">
      <router-outlet />
    </section>
  </main>
</div>
